; WT32-SC01 Plus (ESP32-S3, 320x480 ST7796 8-bit parallel, FT6336 touch)
[env:wt32-sc01-plus]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
extra_scripts =
  pre:scripts/version.py
  post:scripts/merge_bin.py
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DWEBSOCKETS_TCP_TIMEOUT=1500  ; the loop is blocked this long by each failed Home Assistant connect attempt (default 5000)
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  lvgl/lvgl@~9.2.2
  bblanchon/ArduinoJson@^7.2.0
  links2004/WebSockets@^2.6.1
